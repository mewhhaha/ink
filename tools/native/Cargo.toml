[package]
name = "ink-tools"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
anyhow = "1"
flate2 = "1"
crc32fast = "1"
squid-host = { path = "../../../pen/crates/squid-host" }
pen-plugins = { path = "../../../pen/crates/pen-plugins" }
serde_json = "1"
wasmtime = { version = "49", default-features = false, features = ["anyhow", "runtime", "std", "gc", "gc-drc", "backtrace"] }

[dev-dependencies]
regex = "1"
wgpu = "30"
pollster = "1"
bytemuck = "1"

[profile.dev.package."*"]
opt-level = 2
debug = false
[profile.dev]
debug = "line-tables-only"
