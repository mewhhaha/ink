<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ink — Interactive Blot &amp; Pen Examples</title>
  <meta name="description" content="Asset-free game systems library for Blot. Try live WebGPU Pen demos, run WebAssembly examples in your browser, and explore compiler-backed API docs.">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <button id="menu-toggle" class="icon-btn mobile-only" aria-label="Toggle examples menu" aria-expanded="false">☰</button>
      <a class="brand-link" href="#/">
        <span class="brand-mark">INK</span>
        <span class="brand-sub">Blot Game Systems Gallery</span>
      </a>
    </div>
    <nav class="topnav" aria-label="Primary">
      <a class="nav-pill active" href="#/">Examples</a>
      <a class="nav-pill" id="docs-link" href="./docs/index.html">API Docs</a>
      <a class="nav-pill" href="https://github.com/mewhhaha/ink" target="_blank" rel="noopener">GitHub ↗</a>
    </nav>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="Examples navigation">
      <div class="sidebar-controls">
        <input id="search-input" type="search" placeholder="Filter examples or ink/* modules…" autocomplete="off" aria-label="Filter examples">
        <div id="category-tabs" class="category-tabs" role="tablist"></div>
      </div>
      <div id="example-list" class="example-list" role="navigation"></div>
      <div class="sidebar-footer">
        <span id="stats-label">Loading catalog…</span>
      </div>
    </aside>

    <main id="stage" class="stage" tabindex="-1">
      <div class="loading-card">Loading Ink example catalog…</div>
    </main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
