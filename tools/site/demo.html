<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0c1017; color: #e8eef7; font: 14px ui-sans-serif, system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #status { position: absolute; top: 14px; left: 14px; right: 14px; white-space: pre-wrap; pointer-events: none; color: #c7d4e6; text-shadow: 0 1px 2px #000; }
  [aria-label="Captions"] { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 4px 8px; background: #000b; border-radius: 4px; pointer-events: none; white-space: pre-line; text-align: center; }
</style>
<canvas id="game" tabindex="0" aria-label="__TITLE__"></canvas>
<div id="status" role="status">Loading Pen WebGPU runtime…</div>
<script type="module">
import init, { start } from '../../pen/pen_web.js';

const statusEl = document.querySelector('#status');
try {
  if (!('gpu' in navigator)) {
    throw new Error('WebGPU is not available in this browser. Try Chrome/Edge 113+, Firefox 141+, or Safari 26+.');
  }
  await init();
  const canvas = document.querySelector('#game');
  statusEl.textContent = '';
  await start(canvas, {
    game: './game.wasm',
    catalog: './catalog.json',
    manifest: './game.json',
    assets: './assets',
    development: false,
    qualify: false,
  });
  canvas.focus();
} catch (error) {
  statusEl.textContent = String(error);
}
</script>
</html>
