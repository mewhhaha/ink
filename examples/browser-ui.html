<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ink · Field station</title>
  <style>
  :root {
    color-scheme: dark;
    --ink-ui-scale: 1;
    font-family: system-ui,sans-serif;
    background: #101c24;
    color: #f2f1d9;
    font-size: calc(16px * var(--ink-ui-scale));
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: clamp(1rem,4vw,4rem);
  }
  main {
    max-width: 1100px;
    margin: auto;
  }
  header,
  .bar {
    display: flex;
    gap: 1rem;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  h1 {
    font-size: clamp(2rem,5vw,4rem);
    font-weight: 500;
    margin: .5rem 0;
  }
  h2 {
    font-weight: 500;
  }
  .eyebrow {
    letter-spacing: .16em;
    font-size: .75rem;
    color: #b9c7c9;
  }
  .grid {
    display: grid;
    grid-template-columns: minmax(0,1fr) 17rem;
    gap: 2rem;
    margin-top: 2rem;
  }
  .field {
    position: relative;
    min-height: 340px;
    border: 1px solid #698080;
    background: repeating-linear-gradient(0deg,transparent,transparent
      39px,#30434c 40px),repeating-linear-gradient(90deg,transparent,transparent
      39px,#30434c 40px);
    overflow: hidden;
  }
  .island {
    position: absolute;
    width: 65%;
    height: 60%;
    left: 15%;
    top: 20%;
    border: 2px solid #a6d6ad;
    border-radius: 43% 57% 60% 40%;
    transform: rotate(-15deg);
  }
  .island::after {
    content: "";
    position: absolute;
    inset: 20%;
    border: 1px dashed #a6d6ad;
    border-radius: 50%;
  }
  .beacon {
    position: absolute;
    left: 48%;
    top: 47%;
    font-size: 2rem;
    color: #ffdc85;
    animation: pulse 2s infinite;
  }
  .legend {
    position: absolute;
    bottom: 1rem;
    left: 1rem;
    font-size: .8rem;
  }
  @keyframes pulse {
    50% {
      opacity: .5;
    }
  }
  [data-reduced-motion] * {
    animation: none !important;
    transition: none !important;
  }
  [data-high-contrast] {
    background: #000;
    color: #fff;
  }
  [data-high-contrast] button,
  [data-high-contrast] select {
    border-color: #fff;
  }
  button,
  select,
  input {
    font: inherit;
  }
  button,
  select {
    background: #182b35;
    color: inherit;
    border: 1px solid #789398;
    border-radius: 3px;
    padding: .7rem;
  }
  button {
    cursor: pointer;
  }
  button:hover {
    background: #304751;
  }
  :focus-visible {
    outline: 3px solid #ffdc85;
    outline-offset: 4px;
  }
  select {
    width: 100%;
  }
  label {
    display: block;
    margin: 1rem 0 .5rem;
  }
  input[type=range] {
    width: 100%;
    accent-color: #ffdc85;
  }
  input[type=checkbox] {
    accent-color: #ffdc85;
  }
  #cue {
    min-height: 3rem;
    border-left: 3px solid #ffdc85;
    padding: .8rem;
    background: #1a2d35;
    margin-top: 1rem;
  }
  .muted {
    color: #b9c7c9;
    font-size: .85rem;
    line-height: 1.6;
  }
  dialog {
    width: min(26rem,90vw);
    color: inherit;
    background: #142731;
    border: 1px solid #98b1af;
    padding: 2rem;
  }
  dialog::backdrop {
    background: #0009;
  }
  [role=menu] {
    display: grid;
    gap: .5rem;
    margin: .5rem 0;
  }
  [hidden] {
    display: none !important;
  }
  footer {
    margin-top: 2rem;
    border-top: 1px solid #435b62;
    padding-top: 1rem;
  }
  @media (max-width:700px) {
    .grid {
      grid-template-columns: 1fr;
    }
    .field {
      min-height: 260px;
    }
  }
  </style>
  <main>
    <header><div><span class="eyebrow">INK / FIELD STATION 07</span><h1>A signal in the quiet.</h1></div><button id="pause">Pause · Esc</button></header>
    <div class="grid">
      <section
        aria-label="Station map"><div class="field" id="field" tabindex="0" aria-label="Explore station. Press Space to scan, or use gamepad A."><div class="island"></div><span class="beacon" aria-hidden="true">◇</span><span class="legend">◇ Signal · dashed line: survey perimeter</span></div><div id="cue"></div><p class="muted" id="prompt">Space · scan the signal</p><button id="scan">Scan signal</button></section>
      <aside><h2>Inventory</h2><label for="inventory">Equipment</label><select id="inventory" size="3"><option value="receiver" selected>◇ Receiver</option><option value="compass">↗ Compass</option><option value="notebook">▤ Field notebook</option></select><p class="muted" id="selected">Receiver equipped</p><h2>Preferences</h2><label><input id="motion" type="checkbox"> Reduce motion</label><label><input id="contrast" type="checkbox"> High contrast</label><label><input id="captions" type="checkbox" checked> Sound captions</label><label for="scale">UI scale <output id="scale-value">100%</output></label><input id="scale" type="range" min="75" max="150" value="100" step="5"><label for="volume">Signal volume</label><input id="volume" type="range" min="0" max="100" value="30"><button id="rebind">Use Enter to scan</button></aside>
    </div>
    <footer
      class="bar"><span class="eyebrow">CALLER-OWNED STATE / NATIVE CONTROLS</span><span class="muted">Keyboard · pointer · gamepad</span></footer>
  </main>
  <dialog id="pause-dialog"
    aria-labelledby="pause-title"><h2 id="pause-title">Station paused</h2><p class="muted">Take your time. Your settings stay here.</p><button id="resume" autofocus>Resume</button><button id="menu-trigger">Station actions</button><div id="station-menu" aria-label="Station actions"><button data-action="scan">Scan signal</button><button data-action="settings">Focus preferences</button></div></dialog>
  <script type="module" src="./browser-ui.ts"></script>
</html>
