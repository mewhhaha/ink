<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ink · Material field</title>
    <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #141817;
      color: #ecebdc;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
    }
    a {
      color: inherit;
    }
    header {
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #343d35;
    }
    header strong {
      font-size: 20px;
      letter-spacing: -1px;
    }
    header small {
      margin-left: 18px;
      color: #a8b5a3;
    }
    main {
      max-width: 1600px;
      margin: auto;
      padding: 32px;
    }
    .title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 20px;
    }
    h1 {
      font-size: clamp(30px,4vw,54px);
      font-weight: 500;
      letter-spacing: -2px;
      margin: 0;
    }
    .eyebrow {
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 2px;
      color: #adca98;
      margin-bottom: 10px;
    }
    .title p {
      max-width: 250px;
      color: #a8b5a3;
      font-size: 13px;
      line-height: 1.6;
      margin: 0;
    }
    .field {
      display: grid;
      grid-template-columns: minmax(0,1fr) 225px;
      border: 1px solid #343d35;
      border-radius: 5px;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 520px;
      background: #202c25;
    }
    aside {
      padding: 24px;
      background: #1c221e;
    }
    aside h2 {
      font-size: 11px;
      color: #adca98;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 0 0 24px;
    }
    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      padding: 14px 0;
      border-bottom: 1px solid #343d35;
    }
    input {
      accent-color: #b6db77;
    }
    input[type=range] {
      width: 100%;
      margin: 12px 0;
    }
    .exposure {
      display: block;
      border: 0;
      margin-top: 12px;
    }
    button {
      cursor: pointer;
      color: #e3ebd7;
      background: transparent;
      border: 1px solid #697a5c;
      padding: 9px 13px;
      border-radius: 3px;
      font: inherit;
      font-size: 12px;
      width: 100%;
      margin-top: 20px;
    }
    :focus-visible {
      outline: 2px solid #b6db77;
      outline-offset: 4px;
    }
    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #91a18e;
      font-size: 11px;
      padding: 16px 0;
    }
    #status {
      color: #c8d7b7;
    }
    @media (max-width:700px) {
      main,
      header {
        padding: 20px;
      }
      header small {
        display: none;
      }
      .field {
        grid-template-columns: 1fr;
      }
      canvas {
        height: 350px;
      }
      aside {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 20px;
      }
      aside h2 {
        grid-column: 1/-1;
        margin-bottom: 10px;
      }
      .title {
        display: block;
      }
      .title p {
        margin-top: 12px;
      }
    }
    </style>
  </head>
  <body>
    <header><div><strong>ink /</strong><small>Game primitives, composed.</small></div><a href="/examples/browser-ui.html">Input & accessibility ↗</a></header>
    <main>
      <div class="title">
        <div>
          <div class="eyebrow">Rendering study · 01</div>
          <h1>Material field</h1>
        </div>
        <p>One scene. Seven optional GPU passes.<br>Turn a layer off to see what it adds.</p>
      </div>
      <div class="field">
        <canvas id="canvas"
          aria-label="A field of rough and polished spheres, lit by a sky and coloured lamps"></canvas>
        <aside>
          <h2>Light & surface</h2>
          <label
            for="shadows">Cascaded shadows<input id="shadows" type="checkbox" checked></label>
          <label
            for="ao">Ambient occlusion<input id="ao" type="checkbox" checked></label>
          <label
            for="bloom">Bloom<input id="bloom" type="checkbox" checked></label>
          <label
            for="taa">Temporal AA<input id="taa" type="checkbox" checked></label>
          <label for="motion">Motion<input id="motion" type="checkbox"></label>
          <label class="exposure"
            for="exposure">Exposure <output id="stops">0 stops</output><input id="exposure" type="range" min="-3" max="3" step="0.1" value="0"></label>
          <button id="reset" type="button">Reset temporal history</button>
        </aside>
      </div>
      <footer><span>LINEAR HDR / GGX / SKY CONVOLUTION</span><span id="status" role="status">Preparing GPU passes…</span></footer>
      <p id="error" role="alert"></p>
    </main>
    <script type="module" src="./graphics.ts"></script>
  </body>
</html>
