name: Install Pen and Squid
description: Download the toolchain and check out its matching sources for Ink's Rust tools and documentation
inputs:
  pen-version:
    description: Pen release tag
    default: v0.1.6
  squid-version:
    description: Squid release tag
    default: v0.1.0
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: mewhhaha/pen
        ref: refs/tags/${{ inputs.pen-version }}
        path: pen
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: mewhhaha/squid-lang
        ref: refs/tags/${{ inputs.sq-version }}
        path: squid-lang
        persist-credentials: false
    - name: Download and verify release bundles
      shell: bash
      env:
        PEN_VERSION: ${{ inputs.pen-version }}
        SQUID_VERSION: ${{ inputs.sq-version }}
      run: |
        set -euo pipefail
        download() {
          local repo=$1 tag=$2 archive=$3 dest=$4
          local url="https://github.com/mewhhaha/$repo/releases/download/$tag"
          curl -fsSL --retry 3 -O "$url/$archive" -O "$url/$archive.sha256"
          sha256sum -c "$archive.sha256"
          mkdir -p "$dest"
          tar -xzf "$archive" -C "$dest"
          test "$(cat "$dest/source-commit")" = "$(git -C "$GITHUB_WORKSPACE/$repo" rev-parse HEAD)"
        }

        cd "$(mktemp -d "$RUNNER_TEMP/ink-toolchain.XXXXXX")"
        pen_dir="$PWD/pen"
        download pen "$PEN_VERSION" "pen-tools-${PEN_VERSION#v}-ubuntu-24.04-x86_64.tar.gz" "$pen_dir"
        download squid-lang "$SQUID_VERSION" "squid-${SQUID_VERSION#v}-ubuntu-24.04-x86_64.tar.gz" "$PWD/squid"
        install -D -m 755 squid/squidc "$GITHUB_WORKSPACE/squid-lang/compiler-goose/build/squidc-goose"
        cp -a squid/std/. "$GITHUB_WORKSPACE/squid-lang/std/"
        echo "$pen_dir" >> "$GITHUB_PATH"
        echo "PEN_PLUGINS=$pen_dir/plugins" >> "$GITHUB_ENV"
    - name: Install Rust for Ink's native tools
      shell: bash
      working-directory: ink
      run: rustup toolchain install --profile minimal --component rustfmt
