name: Deploy Ink examples site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/ink/tools/native/target
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          path: ink
      - uses: ./ink/.github/actions/setup-toolchain
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Native runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libasound2t64 libdbus-1-3 libudev1
      - name: Binaryen for guest optimization
        run: |
          cd "$RUNNER_TEMP"
          archive=binaryen-version_133-x86_64-linux.tar.gz
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/version_133/$archive"
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $archive" | sha256sum -c
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ink/tools/native
      - name: Build Ink static site (Pen WebGPU demos + Wasm examples + HTML docs)
        working-directory: ink
        run: |
          pen tool ink -- site dist/site --overwrite
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ink/dist/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
