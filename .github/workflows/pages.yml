name: Deploy Ink examples site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/pen/target
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          path: ink
      - uses: actions/checkout@v4
        with:
          repository: mewhhaha/pen
          ref: ${{ vars.PEN_REF || 'main' }}
          path: pen
      - uses: actions/checkout@v4
        with:
          repository: mewhhaha/blot2
          ref: ${{ vars.BLOT2_REF || 'main' }}
          path: blot2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build libasound2-dev libdbus-1-dev binaryen
      - name: Rust web & plugin targets
        working-directory: pen
        run: |
          rustup target add wasm32-unknown-unknown wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            pen
            pen/plugins
            ink/tools/native -> ../../../pen/target
      - name: Native Blot compiler
        working-directory: blot2
        run: |
          sh compiler-goose/build.sh --release
          mkdir -p generated/compiler
          gzip -c compiler-goose/build/blotc-goose > generated/compiler/blotc.gz
      - name: Build Pen CLI, compiler plugin, and browser WebGPU host
        working-directory: pen
        run: |
          cargo build --locked --release -p pen
          CARGO_TARGET_DIR=plugins/target cargo build --locked --manifest-path plugins/Cargo.toml --release --target wasm32-wasip2
          sh crates/pen-web/build.sh target/release/web
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: Build Ink static site (Pen WebGPU demos + Wasm examples + HTML docs)
        working-directory: ink
        run: |
          pen tool ink -- site dist/site --overwrite
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ink/dist/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
