name: Ink library checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/ink/tools/native/target
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          path: ink
      - uses: ./ink/.github/actions/setup-toolchain
      - name: Native runtime and software GPU dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libasound2t64 libdbus-1-3 libudev1 libvulkan1 mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ink/tools/native
      - name: Formatting and generated fixtures
        working-directory: ink
        run: |
          pen tool ink -- fmt --check
          pen tool ink -- generate tools/generate.json
      - name: Blot, Rust, GPU, package and documentation tests
        working-directory: ink
        timeout-minutes: 20
        run: pen test-blot --jobs 4
      - name: Source distribution
        working-directory: ink
        run: pen tool ink -- pack dist/ink
