name: Ink library checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/pen/target
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          path: ink
      - uses: actions/checkout@v4
        with:
          repository: mewhhaha/pen
          ref: ${{ vars.PEN_REF || 'main' }}
          path: pen
      - uses: actions/checkout@v4
        with:
          repository: mewhhaha/blot2
          ref: ${{ vars.BLOT2_REF || 'main' }}
          path: blot2
      - name: Native build and software GPU dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev libvulkan1 mesa-vulkan-drivers
      - name: Rust
        working-directory: pen
        run: rustup toolchain install --profile minimal --component rustfmt
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            pen
            pen/plugins
            ink/tools/native -> ../../../pen/target
      - name: Native compiler
        working-directory: blot2/zig-native
        run: |
          zig build install compiler-identity -Doptimize=fast
          mkdir -p ../generated/compiler
          gzip -c zig-out/bin/blotc > ../generated/compiler/blotc.gz
      - name: Pen and compiler plugin
        working-directory: pen
        run: |
          cargo build --locked --release -p pen
          CARGO_TARGET_DIR=plugins/target cargo build --locked --manifest-path plugins/Cargo.toml --release --target wasm32-wasip2
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: Formatting and generated fixtures
        working-directory: ink
        run: |
          pen tool ink -- fmt --check
          pen tool ink -- generate tools/generate.json
      - name: Blot, Rust, GPU, package and documentation tests
        working-directory: ink
        timeout-minutes: 20
        run: pen test-blot --jobs 4
      - name: Source distribution
        working-directory: ink
        run: pen tool ink -- pack dist/ink
