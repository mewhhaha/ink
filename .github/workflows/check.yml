name: Ink checks and scenarios
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: ink
      - uses: actions/checkout@v4
        with:
          repository: mewhhaha/blot2
          ref: 86a527b97c32331993c4a006da2c982a7336c365
          path: blot2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install the compiler toolchain
        shell: bash
        run: |
          curl --fail --location --retry 3 https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"
      - run: deno task package:build
        working-directory: blot2
      - name: Install Chromium and its system libraries
        run: deno run -A npm:playwright@1.62.1 install --with-deps chromium
        working-directory: ink
      - run: deno task check
        working-directory: ink
      - run: deno task test
        working-directory: ink
      - name: Run golden scenarios with SwiftShader
        working-directory: ink
        run: |
          for project in feel godot trenchbroom hammer; do
            deno task ink test "examples/$project"
          done
          deno task test:scenarios
          deno task test:live
          deno task test:brushes
          deno task test:build
          deno task test:multiplayer
          deno task test:shared
      - name: Save failures and capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-results
          include-hidden-files: true
          path: |
            ink/examples/*/.ink/scenario-results/
            ink/tmp/scenario-failure.png
            ink/tmp/live-agent-workflow.png
            ink/tmp/brush-room.png
            ink/tmp/player-*.png
            ink/tmp/player-timings-*.json
            ink/tmp/multiplayer-*.png
            ink/tmp/multiplayer-results.json
            ink/tmp/shared-*.png
