<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ink raster quality proof</title>
    <style>
    :root {
      color-scheme: dark;
      background: #050505;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    main,
    canvas {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    nav {
      position: fixed;
      top: 16px;
      left: 16px;
      display: flex;
      gap: 8px;
    }

    output {
      position: fixed;
      right: 16px;
      bottom: 16px;
      max-width: calc(100vw - 32px);
      overflow-wrap: anywhere;
    }
    </style>
  </head>
  <body>
    <main data-runtime-state="loading">
      <canvas aria-label="Raster texture and distance LOD proof"></canvas>
      <nav aria-label="Proof camera distance">
        <button type="button" data-distance="near" disabled>Near</button>
        <button type="button" data-distance="far" disabled>Far</button>
      </nav>
      <output>Starting WebGPU</output>
    </main>
    <script type="module" src="/src/raster_quality.ts"></script>
  </body>
</html>
