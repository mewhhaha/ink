<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ink lighting lab</title>

  <body>

      <output id="scene-statistics"></output>
    </aside>
    <script type="module" src="/src/main.ts"></script>
