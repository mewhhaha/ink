<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ink platformer workshop</title>
    <style>
    :root {
      background: #080b16;
      color: #f2f7ff;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    #application {
      position: relative;
      width: min(100vw, 1280px);
      height: min(100vh, 800px);
      overflow: hidden;
      background: #0b1022;
    }

    #scene {
      display: block;
      width: 100%;
      height: 100%;
    }

    #semantic-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    [data-ink-ui-id] {
      margin: 0;
    }

    span[data-ink-ui-id] {
      display: block;
      padding: 6px 12px;
      border: 1px solid rgb(140 190 255 / 45%);
      border-radius: 7px;
      color: #eff7ff;
      background: rgb(5 12 30 / 78%);
      font-size: 18px;
      font-weight: 700;
      text-shadow: 0 2px 4px #000;
    }

    button[data-ink-ui-id] {
      pointer-events: auto;
      border: 1px solid #69b7ff;
      border-radius: 8px;
      color: #f7fbff;
      background: rgb(12 31 65 / 92%);
      font: 700 15px ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 16px rgb(0 0 0 / 45%);
    }

    button[data-ink-ui-id]:focus-visible {
      outline: 3px solid #ffda6a;
      outline-offset: 2px;
    }

    #startup-status,
    #diagnostics {
      position: absolute;
      z-index: 2;
      margin: 0;
      padding: 8px 12px;
      color: #d8e9ff;
      background: rgb(5 12 30 / 76%);
      white-space: pre-wrap;
    }

    #startup-status {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #diagnostics {
      top: 24px;
      right: 24px;
      max-width: 430px;
      font: 13px/1.4 ui-monospace, monospace;
    }
    </style>
  </head>
  <body>
    <main id="application" data-runtime-state="loading">
      <canvas id="scene" width="1280" height="800"></canvas>
      <div id="semantic-layer"
        aria-label="Platformer status and controls"></div>
      <p id="startup-status">Compiling the authored level</p>
      <output id="diagnostics" aria-label="Renderer diagnostics"></output>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
