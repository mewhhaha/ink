<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Sentinel Road</title>
    <style>
    :root {
      color: #f5ead8;
      background: #090b10;
      font-family: ui-serif, Georgia, serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    #application {
      position: relative;
      width: min(100vw, 1280px);
      height: min(100vh, 800px);
      overflow: hidden;
      background: #10131b;
    }

    #scene {
      display: block;
      width: 100%;
      height: 100%;
    }

    #semantic-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    [data-ink-ui-id] {
      margin: 0;
      color: #f7ead4;
      text-shadow: 0 2px 4px #000;
    }

    button[data-ink-ui-id] {
      pointer-events: auto;
      border: 1px solid #d4a75d;
      border-radius: 4px;
      color: #fff6e8;
      background: rgb(31 24 21 / 90%);
      font: 600 16px ui-serif, Georgia, serif;
      cursor: pointer;
    }

    output[data-ink-ui-id],
    span[data-ink-ui-id] {
      display: block;
      padding: 4px 8px;
      background: rgb(8 10 15 / 72%);
    }

    #status {
      position: absolute;
      top: 18px;
      right: 24px;
      max-width: 460px;
      margin: 0;
      padding: 10px 14px;
      background: rgb(8 10 15 / 72%);
      font-size: 18px;
    }

    #presentation {
      position: absolute;
      right: 24px;
      bottom: 24px;
      max-width: 460px;
      white-space: pre-wrap;
    }
    </style>
  </head>
  <body>
    <main id="application" data-runtime-state="loading">
      <canvas id="scene" width="1280" height="800"></canvas>
      <div id="semantic-layer" aria-label="Role-playing actions"></div>
      <h1 id="status">Entering the Sentinel Road…</h1>
      <output id="presentation" aria-live="polite"></output>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
